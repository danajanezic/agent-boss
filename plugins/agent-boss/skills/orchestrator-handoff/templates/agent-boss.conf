# agent-boss project settings (sourced by orch.sh as shell). Environment values win.
# Project name, used in the prompt a new lane gets.
ORCH_PROJECT="My Project"
# Who the sessions work for, used in messages such as "ask <user> to close it".
ORCH_USER="the user"
# GitHub repo (owner/name) for the PR lines in `snapshot`. Empty skips them.
ORCH_REPO=""
# Optional build-lock script with a `who` command that prints holders. Empty skips the lock checks.
# Relative paths are inside this handover dir.
ORCH_LOCK=""
# Optional script whose output lines join `snapshot` (remote machines, drives, queues).
ORCH_SNAPSHOT_HOOK=""
# One sentence appended to every new lane's start prompt (house rules, pronouns, etc.).
ORCH_LANE_PROMPT_EXTRA=""
# Permission mode for lanes started with start-lane. Background sessions can't answer prompts, so auto is the default.
ORCH_LANE_PERMISSION_MODE="auto"
# Context size used to estimate a fresh lane's startup reading, and the warning threshold in percent.
ORCH_CTX=200000
ORCH_CTX_WARN_PCT=10
