# agent-boss project settings: plain ORCH_NAME="value" lines (read as data, not run). Environment values win.
# Project name, used in the prompt a new lane gets.
ORCH_PROJECT="My Project"
# Who the sessions work for, used in messages such as "ask <user> to close it".
ORCH_USER="the user"
# GitHub repo (owner/name) for the PR lines in `snapshot`. Empty skips them.
ORCH_REPO=""
# ORCH_LOCK (a build-lock script with a `who` command) and ORCH_SNAPSHOT_HOOK (a script
# whose output joins `snapshot`) run programs, so they are ignored here: set them in
# ~/.config/agent-boss/config or the environment. Relative paths are inside the handover dir.
# One sentence appended to every new lane's start prompt (house rules, pronouns, etc.).
ORCH_LANE_PROMPT_EXTRA=""
# The lane permission mode (ORCH_LANE_PERMISSION_MODE: auto, default, acceptEdits or plan; default auto)
# is ignored here too, so a handover dir can't raise it: set it in ~/.config/agent-boss/config.
# Context size used to estimate a fresh lane's startup reading, and the warning threshold in percent.
ORCH_CTX=200000
ORCH_CTX_WARN_PCT=10
# Automatic orchestrator handoff: context tokens at which the orchestrator starts its own
# successor (0 turns it off), and the model the successor runs on.
ORCH_HANDOFF_AT=150000
ORCH_ORCHESTRATOR_MODEL="opus"
# Folder the successor starts in (must be one Claude already trusts). Empty = where the current orchestrator runs.
ORCH_ORCHESTRATOR_DIR=""
